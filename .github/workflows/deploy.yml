name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Default to the minimum permissions needed by verification and build jobs.
permissions:
  contents: read

# Never let two deploys run at once.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync shared modules into Edge Functions
        run: npm run sync:shared

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & flow tests
        run: npm run test

      - name: Verify shared modules are committed in sync
        run: |
          if ! git diff --quiet -- supabase/functions/_shared; then
            echo "::error::supabase/functions/_shared is out of date. Run 'npm run sync:shared' and commit."
            git diff -- supabase/functions/_shared
            exit 1
          fi

  build:
    name: Build static site
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Only public values here. VITE_* variables are inlined into the bundle.
      # Never put privileged credentials in VITE_* variables.
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # Project Pages use /<repo>/; user/organisation Pages use /.
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  e2e:
    name: End-to-end tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Build for tests
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder_for_e2e_only_000000000
          VITE_BASE_PATH: /
        run: npm run build

      # Both viewport projects use Chromium. The mobile-Safari project needs
      # WebKit, which is deliberately not installed here to keep CI time down.
      - run: npx playwright test --project=desktop-chrome
      - run: npx playwright test --project=mobile-chrome

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: [build, e2e]
    runs-on: ubuntu-latest

    # Only the deployment job needs permission to publish Pages.
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
